<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Word Trainer · connection test</title>
<style>
:root{--bg:#EDF1F7;--card:#fff;--ink:#16233B;--muted:#5B6884;--line:#D3DBE8;--ok:#1D7A4B;--okbg:#E3F4EA;--bad:#B3372F;--badbg:#FBE7E5;--acc:#1F4E8C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--card:#18223A;--ink:#E7ECF6;--muted:#9BA7C0;--line:#2B3756;--ok:#58C892;--okbg:#16352A;--bad:#F2857A;--badbg:#3A1F24;--acc:#86ADEB}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row b{font-size:1rem}
.st{font-weight:700;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.sum{border-radius:14px;padding:14px;font-weight:700;font-size:1.1rem;text-align:center}
.sum.ok{background:var(--okbg)}.sum.bad{background:var(--badbg)}
.det{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
button{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:var(--bg);min-height:50px;padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Connection test</h1>
  <p class="muted" id="intro">Checks that this page can reach the Word Trainer server.</p>
  <div id="sum"></div>
  <div id="list"></div>
  <button id="again" hidden>Run again</button>
  <p class="det" id="dev"></p>
</div>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1));
  var s=h.get("s")||"",k=h.get("k")||"";
  var $=function(id){return document.getElementById(id)};
  var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  $("dev").textContent="Screen "+innerWidth+" px · "+(navigator.standalone||matchMedia("(display-mode: standalone)").matches?"home screen icon":"browser tab")+" · "+navigator.userAgent;
  if(!/^AKfyc[\w-]{20,}$/.test(s)||!k){
    $("sum").innerHTML='<div class="sum bad">Open this page from your link.</div>';return;
  }
  var URL_="https://script.google.com/macros/s/"+s+"/exec";
  function post(body){
    var ctl=("AbortController" in window)?new AbortController():null;
    var t=ctl?setTimeout(function(){ctl.abort()},45000):0;
    var t0=Date.now();
    return fetch(URL_,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
      .then(function(r){return r.text().then(function(txt){
        var j=null;try{j=JSON.parse(txt)}catch(e){}
        if(!j)throw new Error("HTTP "+r.status+", not JSON: "+txt.slice(0,120));
        return {j:j,ms:Date.now()-t0};
      })})
      .finally(function(){clearTimeout(t)});
  }
  var big=new Array(1200001).join("a"); /* about 1.2 MB, like a photo */
  var TESTS=[
    {name:"Server answers",run:function(){return post({fn:"ping",key:k}).then(function(r){
      if(!r.j.ok)throw new Error(r.j.error);return "OK in "+(r.ms/1000).toFixed(1)+" s"})}},
    {name:"Reads the notebook",run:function(){return post({fn:"getNotebook",key:k}).then(function(r){
      if(!r.j.ok)throw new Error(r.j.error);var n=JSON.parse(r.j.result||"[]").length;
      if(!n)throw new Error("no words");return n+" words in "+(r.ms/1000).toFixed(1)+" s"})}},
    {name:"Sends a photo-sized request (1.2 MB)",run:function(){return post({fn:"ping",key:k,args:[big]}).then(function(r){
      if(!r.j.ok)throw new Error(r.j.error);return Math.round(r.j.result.size/1000)+" kB in "+(r.ms/1000).toFixed(1)+" s"})}},
    {name:"Refuses a wrong key",run:function(){return post({fn:"getNotebook",key:"wrong"}).then(function(r){
      if(r.j.ok)throw new Error("it did NOT refuse");return "refused"})}}
  ];
  function runAll(){
    $("again").hidden=true;$("sum").innerHTML="";
    $("list").innerHTML=TESTS.map(function(t,i){return '<div class="card"><div class="row"><b>'+esc(t.name)+'</b><span class="st" id="st'+i+'">...</span></div><div class="det" id="dt'+i+'"></div></div>'}).join("");
    var good=0,i=0;
    (function next(){
      if(i>=TESTS.length){
        var all=good===TESTS.length;
        $("sum").innerHTML='<div class="sum '+(all?"ok":"bad")+'">'+(all?"All "+good+" checks passed":(TESTS.length-good)+" of "+TESTS.length+" checks failed")+'</div>';
        $("again").hidden=false;return;
      }
      var n=i++;
      TESTS[n].run().then(function(msg){good++;$("st"+n).textContent="OK";$("st"+n).className="st ok";$("dt"+n).textContent=msg})
        .catch(function(e){$("st"+n).textContent="Failed";$("st"+n).className="st bad";$("dt"+n).textContent=(e&&e.name==="AbortError")?"No answer in 45 s":String(e&&e.message||e)})
        .then(next);
    })();
  }
  $("again").onclick=runAll;
  runAll();
})();
</script>
</body>
</html>
